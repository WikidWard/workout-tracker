<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="static/styles.css">
  <title>Workout Tracker</title>
</head>
<body>
<header class="topbar">
  <div>
    <h1>Workout Tracker</h1>
    <div id="programmeStatus" class="muted"></div>
  </div>
  <button id="installHint" class="secondary small">iPhone</button>
</header>

<main>
  <nav class="tabs">
    <button class="tab active" data-screen="workout">Workout</button>
    <button class="tab" data-screen="history">History</button>
    <button class="tab" data-screen="programmes">Programmes</button>
  </nav>

  <section id="workoutScreen" class="screen active">
    <div class="card">
      <div class="row between">
        <div>
          <h2 id="workoutTitle">Today's Workout</h2>
          <div><label for="workoutDate">Workout date</label><input id="workoutDate" type="date"></div>
        </div>
        <select id="daySelect" aria-label="Workout day"></select>
      </div>
    </div>
    <div id="exerciseList"></div>
    <div class="card">
      <label for="sessionNotes">Session notes</label>
      <textarea id="sessionNotes" rows="3" placeholder="How did the session go?"></textarea>
      <button id="saveSession" class="primary full">Save Workout</button>
      <p id="saveMessage" class="success"></p>
    </div>
  </section>

  <section id="historyScreen" class="screen">
    <div class="card">
      <h2>Workout History</h2>
      <div id="historyList"></div>
    </div>
    <div class="card">
      <h2>Exercise History</h2>
      <select id="exerciseHistorySelect"></select>
      <div id="exerciseHistory"></div>
    </div>
  </section>

  <section id="programmesScreen" class="screen">
    <div class="card">
      <div class="row between">
        <div>
          <h2>Programmes</h2>
          <p class="muted">Your old programmes stay available for comparison.</p>
        </div>
        <button id="newProgramme" class="primary">New Programme</button>
      </div>
      <div id="programmeList"></div>
    </div>
  </section>
</main>

<div id="modal" class="modal hidden">
  <div class="modalBox">
    <div class="row between">
      <h2 id="modalTitle">Programme</h2>
      <button id="closeModal" class="secondary small">Close</button>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

<script src="static/app.js?v=4"></script>
</body>
</html>
